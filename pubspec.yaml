name: sukh_app
description: "A new Flutter project."
publish_to: "none"
version: 2.1.30+68

environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  page_transition: ^2.2.1
  dropdown_button2: ^2.3.8
  google_fonts: ^8.0.2
  http: ^1.6.0
  flutter_screenutil: ^5.9.3
  cupertino_icons: ^1.0.8
  top_snackbar_flutter: ^3.3.0
  go_router: ^17.0.0
  shared_preferences: ^2.1.1
  equatable: ^2.0.6
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.5
  rename: ^3.1.0
  connectivity_plus: ^7.0.0
  shake: ^3.0.0
  local_auth: ^3.0.0
  socket_io_client: ^2.0.3+1
  flutter_svg: ^2.0.9
  flutter_dynamic_icon_plus: ^1.4.1
  device_info_plus: ^11.4.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  record: ^6.1.1
  path_provider: ^2.1.0
  audioplayers: ^6.0.0
  liquid_glass_renderer:
    path: packages/liquid_glass_renderer-0.2.0-dev.4
  syncfusion_flutter_pdfviewer: ^28.1.36
  provider: ^6.1.2
  package_info_plus: ^8.0.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  flutter_webrtc: ^1.4.1
  intl: ^0.20.2
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

# record_linux 0.7.2 does not implement record_platform_interface 1.5.0 (startStream, hasPermission signature).
# Force a newer record_linux that implements the interface so iOS build succeeds.
dependency_overrides:
  record_linux: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/img/main_logo.png"
  adaptive_icon_foreground: "lib/assets/img/main_logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  # Only include assets that are actually used
  assets:
    # assets/fonts/ авагдав — хавтас нь 0 байт .ttf хоёроос өөр юу ч
    # агуулаагүй, хавтсыг устгасан тул зарлалт нь build-ыг унагах байсан.
    - lib/assets/img/
    - lib/assets/pdf/
  # Enable tree-shaking for fonts (only include used font weights)
  # This reduces font file size significantly

  # ФОНТ: `Inter` family-г УСТГАВ.
  #
  # `assets/fonts/Inter-*.ttf` файлууд 0 БАЙТ байсан (git дээр ч мөн адил)
  # тул family нь хэзээ ч ачаалагдаагүй — апп бүх дэлгэц дээр системийн
  # фонтоор (iOS: San Francisco, Android: Roboto) л зурагдаж байсан.
  #
  # Мөн зөвхөн 400 ба 700 жин зарлагдсан байсан нь хавх: жинхэнэ Inter
  # файлыг тавибал Flutter хүссэн жинг хамгийн ойрын зарлагдсан жинтэй
  # тулгадаг тул `FontWeight.w600` (кодод 193 газар) → 700 болж, апп
  # одоогийнхоос ч илүү тод болох байлаа.
  #
  # Inter-ийг эргүүлэн оруулах бол: 400/500/600/700 жингийн .ttf-г
  # (https://github.com/rsms/inter) тавьж, ТУС БҮРИЙГ нь `weight`-тэй
  # зарлаад, `main.dart`-ын хоёр theme дээр `fontFamily: 'Inter'` нэмнэ.
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
